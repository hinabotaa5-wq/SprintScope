<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コーチ申請・ログイン | SprintScope</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="qb-app coach-entry-page">
    <header class="header glass">
        <div class="header-inner">
            <div class="logo-area">
                <h1 class="main-logo" onclick="location.href='qb_top.html'">SprintScope</h1>
                <p class="sub-message">コーチの申請またはログイン</p>
            </div>
        </div>
    </header>

    <main class="main-wrap coach-entry-wrap">
        <div id="coach-entry-application" class="coach-entry-application">
            <section class="flow-card coach-register-card" aria-labelledby="coach-apply-title">
                <h2 id="coach-apply-title" class="coach-register-title">コーチ申請</h2>
                <p class="coach-register-lead">認定コーチとして活動いただく前に、以下の内容をご提出ください。</p>

                <form id="form-coach-apply" class="coach-register-form" novalidate>
                    <div class="input-group">
                        <label for="coach-name">お名前 <span class="req">必須</span></label>
                        <input type="text" id="coach-name" name="name" autocomplete="name" placeholder="山田 太郎" required>
                    </div>
                    <div class="input-group">
                        <label for="coach-org-url">現在指導している所属先のホームページURL <span class="req">必須</span></label>
                        <input type="url" id="coach-org-url" name="org_url" inputmode="url" placeholder="https://example-club.jp/" required>
                    </div>
                    <div class="input-group">
                        <label for="coach-sns-url">個人SNSまたは所属先のSNSのURL <span class="req">必須</span></label>
                        <input type="url" id="coach-sns-url" name="sns_url" inputmode="url" placeholder="https://instagram.com/…" required>
                    </div>
                    <div class="flow-actions coach-register-actions">
                        <button type="submit" class="btn-primary btn-register-submit">申請する</button>
                    </div>
                </form>
            </section>

            <section class="coach-login-strip" aria-label="ログイン">
                <form id="form-coach-login" class="coach-login-form" novalidate>
                    <span class="coach-login-heading">ログイン</span>
                    <input type="password" id="coach-login-password" name="password" class="coach-login-password" autocomplete="current-password" placeholder="パスワード" required aria-label="パスワード">
                    <button type="submit" class="btn-primary btn-login-compact">入る</button>
                </form>
                <p class="coach-entry-note">※ 認証・保存は未接続です。UI確認用です。</p>
            </section>

            <p class="coach-entry-back">
                <a href="qb_top.html" class="btn-secondary">利用目的選択へ戻る</a>
            </p>
        </div>

        <section id="coach-entry-thanks" class="flow-card coach-thanks-card coach-entry-hidden" aria-labelledby="coach-thanks-title" hidden>
            <p class="coach-thanks-emoji" aria-hidden="true">✅</p>
            <h2 id="coach-thanks-title" class="coach-thanks-title">申請ありがとうございます</h2>
            <p class="coach-thanks-body">
                申請後<strong>24時間以内</strong>に、ご登録いただいた<strong>個人SNSまたは所属先のSNS</strong>宛てに、本人確認のため<strong>ダイレクトメッセージ</strong>をお送りします。メッセージをご確認のうえ、ご対応をお願いいたします。
            </p>
            <p class="coach-entry-back coach-thanks-back">
                <a href="qb_top.html" class="btn-secondary">利用目的選択へ戻る</a>
            </p>
        </section>
    </main>

    <script>
        (function () {
            var applicationEl = document.getElementById('coach-entry-application');
            var thanksEl = document.getElementById('coach-entry-thanks');

            function showThanks() {
                applicationEl.classList.add('coach-entry-hidden');
                applicationEl.setAttribute('hidden', '');
                thanksEl.classList.remove('coach-entry-hidden');
                thanksEl.removeAttribute('hidden');
                thanksEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            document.getElementById('form-coach-apply').addEventListener('submit', function (e) {
                e.preventDefault();
                if (!this.reportValidity()) return;
                showThanks();
            });

            document.getElementById('form-coach-login').addEventListener('submit', function (e) {
                e.preventDefault();
                if (!this.reportValidity()) return;
                window.alert('現在はフロントのみのため、ログイン処理は未実装です。');
            });
        }());
    </script>
</body>

</html>
