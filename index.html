<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SprintScope - Cloud Sync版</title>
    <style>
        /* デザイン（CSS） */
        body { font-family: sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; padding-bottom: 70px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #e67e22; text-align: center; margin-bottom: 10px; }
        
        .tab-menu { display: flex; justify-content: center; gap: 20px; border-bottom: 2px solid #eee; margin-bottom: 20px; }
        .tab-btn { background: none; border: none; padding: 10px 20px; font-size: 1em; cursor: pointer; color: #999; }
        .tab-btn.active { color: #e67e22; font-weight: bold; border-bottom: 3px solid #e67e22; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        
        .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .video-card { background: #eee; border-radius: 8px; cursor: pointer; text-align: center; padding-bottom: 10px; }
        .thumbnail { background: #333; color: white; height: 100px; display: flex; align-items: center; justify-content: center; font-size: 2em; border-radius: 8px 8px 0 0; }
        
        .btn-orange { background: #e67e22; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        .btn-orange:disabled { background: #ccc; cursor: not-allowed; }
        .btn-back { background: #95a5a6; color: white; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; margin-bottom: 10px; }
        .btn-speed { background: #eee; border: 1px solid #ccc; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .btn-speed.active { background-color: #e67e22; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>SprintScope</h1>

    <div id="top-tabs" class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('home')">ホーム</button>
        <button class="tab-btn" onclick="switchTab('upload')">投稿</button>
    </div>

    <div id="home-screen">
        <div class="video-grid" id="main-grid">
            </div>
    </div>

    <div id="upload-screen" style="display: none;">
        <div class="input-group">
            <label>動画を選択 (必須)：</label>
            <input type="file" id="video-file-input" accept="video/*">
        </div>
        <div class="input-group">
            <label>分析したい局面 (必須)：</label>
            <select id="sprint-phase">
                <option value="">-- 選択してください --</option>
                <option value="スタート">スタート</option>
                <option value="中間疾走">中間疾走</option>
                <option value="ラスト">ラスト</option>
            </select>
        </div>
        <div class="input-group">
            <label>自己ベスト (任意)：</label>
            <input type="number" id="pb-time" step="0.01" min="0" placeholder="10.85">
        </div>
        <div class="input-group">
            <label>聞きたいこと (必須)：</label>
            <textarea id="user-question"></textarea>
        </div>
        <button class="btn-orange" id="submit-btn" onclick="submitPost()">クラウドに投稿する</button>
        <p id="loading-msg" style="display:none; text-align:center; color: #e67e22;">アップロード中...（数秒かかります）</p>
    </div>

    <div id="analysis-screen" style="display: none;">
        <button class="btn-back" onclick="backToHome()">← 戻る</button>
        <h2 id="current-title" style="font-size: 1.1em;">動画分析</h2>
        <video id="myVideo" controls width="100%" style="border-radius: 8px; background:#000;"></video>
        <div style="text-align: center; margin: 15px 0;">
            <button class="btn-speed" onclick="changeSpeed(0.5, this)">0.5x</button>
            <button class="btn-speed active" onclick="changeSpeed(1.0, this)">1.0x</button>
        </div>
        <textarea id="advice-input" placeholder="メモを入力..."></textarea>
        <button class="btn-orange" onclick="sendAdvice()">保存</button>
        <ul id="advice-list" style="padding:0; list-style:none; margin-top:20px;"></ul>
    </div>
</div>

<script>
    const CLOUD_NAME = "doipeut1j"; 
    const UPLOAD_PRESET = "sprint_preset"; // Unsignedのもの

    // 1. タブ切り替え
    function switchTab(tabName) {
        const btns = document.querySelectorAll('.tab-btn');
        btns.forEach(b => b.classList.remove('active'));
        if(event && event.currentTarget) event.currentTarget.classList.add('active');

        document.getElementById('home-screen').style.display = tabName === 'home' ? 'block' : 'none';
        document.getElementById('upload-screen').style.display = tabName === 'upload' ? 'block' : 'none';
        document.getElementById('analysis-screen').style.display = 'none';
        document.getElementById('top-tabs').style.display = 'flex';
    }

    // 2. クラウド投稿（ここが進化ポイント！）
    async function submitPost() {
        const fileInput = document.getElementById('video-file-input');
        const phase = document.getElementById('sprint-phase').value;
        const pb = document.getElementById('pb-time').value;
        const question = document.getElementById('user-question').value;

        if (!fileInput.files[0] || phase === "" || question.trim() === "") {
            alert("必須項目を埋めてください！");
            return;
        }

        // ボタンを無効化して「待ち」を作る
        document.getElementById('submit-btn').disabled = true;
        document.getElementById('loading-msg').style.display = 'block';

        // クラウドへ送る準備
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('upload_preset', UPLOAD_PRESET);

        try {
            // クラウドへ送信
            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            const videoUrl = data.secure_url; // クラウド上の動画URL！

            // 成功したらデータを保存
            const postData = {
                url: videoUrl,
                title: `【${phase}】(${pb || '--.--'}s)`,
                question: question,
                date: new Date().toLocaleString()
            };

            saveToStorage(postData);
            renderHome(); // ホームを更新
            alert("クラウド保存完了！");
            switchTab('home');

        } catch (e) {
            alert("通信エラー：設定を確認してください。");
        } finally {
            document.getElementById('submit-btn').disabled = false;
            document.getElementById('loading-msg').style.display = 'none';
        }
    }

    // 3. データの永続化（ブラウザのロッカーにURLをメモ）
    function saveToStorage(newPost) {
        const posts = JSON.parse(localStorage.getItem('sprint_posts') || '[]');
        posts.unshift(newPost); // 先頭に追加
        localStorage.setItem('sprint_posts', JSON.stringify(posts));
    }

    // 4. ホーム画面の描画（読み込み時に呼び出す）
    function renderHome() {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = ""; // 一旦空にする
        const posts = JSON.parse(localStorage.getItem('sprint_posts') || '[]');

        posts.forEach(post => {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.onclick = () => openAnalysis(post.url, post.title);
            card.innerHTML = `<div class="thumbnail">⚡</div><p>${post.title}</p>`;
            grid.appendChild(card);
        });
    }

    // 5. 分析画面の処理
    function openAnalysis(url, title) {
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('upload-screen').style.display = 'none';
        document.getElementById('top-tabs').style.display = 'none';
        document.getElementById('analysis-screen').style.display = 'block';

        document.getElementById('current-title').innerText = title;
        document.getElementById('myVideo').src = url;
    }

    function backToHome() { switchTab('home'); }

    function changeSpeed(s, el) {
        document.getElementById('myVideo').playbackRate = s;
        document.querySelectorAll('.btn-speed').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }

    // アドバイス保存（これまで通り）
    function sendAdvice() {
        const input = document.getElementById('advice-input');
        if (input.value.trim() === "") return;
        const list = document.getElementById('advice-list');
        const li = document.createElement('li');
        li.innerHTML = `<small>${new Date().toLocaleString()}</small><br>${input.value}`;
        list.prepend(li);
        localStorage.setItem('sprint_memo', list.innerHTML);
        input.value = "";
    }

    // 起動時の復元
    window.onload = function() {
        renderHome();
        const savedMemo = localStorage.getItem('sprint_memo');
        if (savedMemo) document.getElementById('advice-list').innerHTML = savedMemo;
    };
</script>

</body>
</html>
