<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SprintScope - Full Profile Version</title>
    <style>
        /* デザイン（CSS） */
        body { font-family: sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; padding-bottom: 70px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h1 { color: #e67e22; margin: 0; font-size: 1.5em; }
        .btn-logout {background: #95a5a6;color: white;border: none;padding: 5px 15px;border-radius: 5px;cursor: pointer;font-size: 0.8em;}
        .btn-logout:hover {background: #7f8c8d;}
        .profile-icon { background: #eee; border: none; font-size: 1.5em; cursor: pointer; border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; }

        .tab-menu { display: flex; justify-content: center; gap: 20px; border-bottom: 2px solid #eee; margin-bottom: 20px; }
        .tab-btn { background: none; border: none; padding: 10px 20px; font-size: 1em; cursor: pointer; color: #999; }
        .tab-btn.active { color: #e67e22; font-weight: bold; border-bottom: 3px solid #e67e22; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        
        .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .video-card { position: relative; background: #eee; border-radius: 8px; cursor: pointer; text-align: center; padding-bottom: 10px; overflow: hidden; transition: 0.2s; }
        .video-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .thumbnail { background: #333; color: white; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 1.5em; }
        
        .del-btn { position: absolute; top: 5px; right: 5px; background: rgba(255,255,255,0.8); border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; color: #e74c3c; z-index: 10; }
        .del-btn:hover { background: #e74c3c; color: white; }

        .btn-orange { background: #e67e22; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        .btn-back { background: #95a5a6; color: white; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; margin-bottom: 10px; }
        .btn-speed { background: #eee; border: 1px solid #ccc; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .btn-speed.active { background-color: #e67e22; color: white; }
        .advice-box { background:#fff9f0; padding:15px; border-left:5px solid #e67e22; border-radius:5px; margin-top:15px; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>SprintScope</h1>
        <div style="display: flex; align-items: center; gap: 10px;">
            <button id="auth-btn" class="btn-logout" onclick="handleAuth()">ログイン</button>
            <button class="profile-icon" onclick="switchTab('profile')">👤</button>
        </div>
    </div>

    <div id="top-tabs" class="tab-menu">
        <button id="tab-btn-home" class="tab-btn active" onclick="switchTab('home')">ホーム</button>
        <button id="tab-btn-upload" class="tab-btn" onclick="switchTab('upload')">投稿</button>
    </div>

    <div id="home-screen">
        <div class="video-grid" id="main-grid"></div>
    </div>

    <div id="upload-screen" style="display: none;">
        <div class="input-group">
            <label>動画を選択：</label>
            <input type="file" id="video-file-input" accept="video/*">
        </div>
        <div class="input-group">
            <label>局面：</label>
            <select id="sprint-phase">
                <option value="スタート">スタート</option>
                <option value="中間疾走">中間疾走</option>
                <option value="ラスト">ラスト</option>
            </select>
        </div>
        <div class="input-group">
            <label>聞きたいこと（課題）：</label>
            <textarea id="user-question" placeholder="例：接地が長い気がします..."></textarea>
        </div>
        <button class="btn-orange" id="submit-btn" onclick="submitPost()">クラウドに投稿する</button>
        <p id="loading-msg" style="display:none; text-align:center; color: #e67e22;">アップロード中...</p>
    </div>

    <div id="profile-screen" style="display: none;">
        <button class="btn-back" onclick="switchTab('home')">← 戻る</button>
        <h2 style="text-align:center; color:#e67e22; margin-bottom:10px;">選手プロフィール</h2>
        <div style="font-weight: bold; margin-bottom: 10px; font-size: 0.9em;">これまでの練習動画</div>
        <div id="profile-video-list" class="video-grid" style="margin-bottom: 25px;"></div>
    </div>

    <div id="analysis-screen" style="display: none;">
        <button class="btn-back" onclick="switchTab('home')">← 戻る</button>
        <h2 id="current-title" style="font-size: 1.1em; margin-top:0;">動画分析</h2>
        <video id="myVideo" controls width="100%" style="border-radius: 8px; background:#000;"></video>
        <div style="text-align: center; margin: 15px 0;">
            <button class="btn-speed" onclick="changeSpeed(0.5, this)">0.5x</button>
            <button class="btn-speed active" onclick="changeSpeed(1.0, this)">1.0x</button>
        </div>
        <div class="advice-box" style="margin-top: 20px;">
            <textarea id="advise-input" placeholder="アドバイス・感想を入力" style="height: 80px;"></textarea>
            <button class="btn-orange" onclick="postAdvice()" style="margin-top: 10px;">アドバイスを送る</button>
        </div>
        <div id="comment-list" style="margin-top: 20px;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebaseの設定
    const firebaseConfig = {
        apiKey: "AIzaSyDFxbyaB9H-Zadg5FvRjxufg2eibVNw3vA",
        authDomain: "sprintscope-e8ef7.firebaseapp.com",
        projectId: "sprintscope-e8ef7",
        storageBucket: "sprintscope-e8ef7.firebasestorage.app",
        messagingSenderId: "585818029718",
        appId: "1:585818029718:web:dd4d9190027289d4b64cb7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const CLOUD_NAME = "doipeut1j"; 
    const UPLOAD_PRESET = "sprint_preset"; 

    // --- 1. ログイン・ログアウト管理 ---
    window.handleAuth = async function() {
        if (auth.currentUser) {
            if (confirm("ログアウトしますか？")) {
                await signOut(auth);
                location.reload();
            }
        } else {
            try {
                await signInWithPopup(auth, provider);
            } catch (e) { alert("ログイン失敗"); }
        }
    }

    onAuthStateChanged(auth, (user) => {
        const authBtn = document.getElementById('auth-btn');
        if (user) {
            authBtn.innerText = "ログアウト";
            authBtn.style.background = "#95a5a6";
        } else {
            authBtn.innerText = "ログイン";
            authBtn.style.background = "#e67e22";
        }
        renderVideos(); // ログイン状態が変わったら画面を更新
    });

    // --- 2. タブ切り替え ---
    window.switchTab = async function(tabName) {
        if (tabName === 'upload' && !auth.currentUser) {
            if (confirm("投稿にはログインが必要です。ログインしますか？")) {
                await signInWithPopup(auth, provider);
            } else { return; }
        }

        const screens = ['home', 'upload', 'profile', 'analysis'];
        screens.forEach(s => document.getElementById(s + '-screen').style.display = 'none');
        document.getElementById(tabName + '-screen').style.display = 'block';

        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        if(tabName === 'home') document.getElementById('tab-btn-home').classList.add('active');
        if(tabName === 'upload') document.getElementById('tab-btn-upload').classList.add('active');

        const topTabs = document.getElementById('top-tabs');
        if(topTabs) topTabs.style.display = (tabName === 'profile' || tabName === 'analysis') ? 'none' : 'flex';
        
        renderVideos();
    }

    // --- 3. 投稿機能（Cloudinary + Firestore） ---
    window.submitPost = async function() {
        const fileInput = document.getElementById('video-file-input');
        const phase = document.getElementById('sprint-phase').value;
        const question = document.getElementById('user-question').value;
        const user = auth.currentUser;

        if (!user || !fileInput.files[0]) { alert("動画とログインが必要です"); return; }

        document.getElementById('submit-btn').disabled = true;
        document.getElementById('loading-msg').style.display = 'block';

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('upload_preset', UPLOAD_PRESET);

        try {
            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
                method: 'POST', body: formData
            });
            const data = await response.json();
            
            await addDoc(collection(db, "posts"), {
                url: data.secure_url,
                title: `【${phase}】 ${new Date().toLocaleDateString()}`,
                question: question || "（質問なし）",
                userId: user.uid,
                createdAt: new Date()
            });

            alert("投稿完了！");
            document.getElementById('user-question').value = "";
            document.getElementById('video-file-input').value = "";
            switchTab('home');
        } catch (e) {
            console.error(e);
            alert("アップロード失敗");
        } finally {
            document.getElementById('submit-btn').disabled = false;
            document.getElementById('loading-msg').style.display = 'none';
        }
    };

    // --- 4. 動画一覧の描画（ホーム & プロフィール） ---
    async function renderVideos() {
        const grid = document.getElementById('main-grid');
        const profGrid = document.getElementById('profile-video-list');
        const user = auth.currentUser;

        if (grid) grid.innerHTML = "読み込み中...";
        if (profGrid) profGrid.innerHTML = "";

        try {
            const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
            const querySnapshot = await getDocs(q);
            
            if (grid) grid.innerHTML = "";

            querySnapshot.forEach((docSnap) => {
                const post = docSnap.data();
                const id = docSnap.id;

                // 分析画面を開く処理を共通化
                const openAnalysis = () => {
                    window.currentPostId = id;
                    switchTab('analysis');
                    document.getElementById('current-title').innerText = post.question;
                    const video = document.getElementById('myVideo');
                    video.src = post.url;
                    video.load();
                    renderComments(id);
                };

                // ホーム用カード
                const homeCard = document.createElement('div');
                homeCard.className = 'video-card';
                homeCard.innerHTML = `<div class="thumbnail"></div><p>${post.question}</p>`;
                homeCard.onclick = openAnalysis;
                if (grid) grid.appendChild(homeCard);

                // プロフィール用カード（自分の投稿のみ）
                if (profGrid && user && post.userId === user.uid) {
                    const profCard = document.createElement('div');
                    profCard.className = 'video-card';
                    profCard.style.position = "relative"; // ×ボタンの基準点
                    profCard.innerHTML = `<div class="thumbnail"></div><p>${post.question}</p>`;
                    profCard.onclick = openAnalysis;

                    const delBtn = document.createElement('button');
                    delBtn.className = 'del-btn';
                    delBtn.innerHTML = '×';
                    delBtn.onclick = (e) => {
                        e.stopPropagation(); // 分析画面が開くのを防ぐ
                        deleteVideo(id);
                    };
                    profCard.appendChild(delBtn);
                    profGrid.appendChild(profCard);
                }
            });
        } catch (e) {
            console.error("データ取得エラー:", e);
        }
    }

    // --- 5. 削除機能 ---
    window.deleteVideo = async function(id) {
        if (!confirm("この練習動画を削除しますか？")) return;
        try {
            await deleteDoc(doc(db, "posts", id));
            alert("削除しました");
            renderVideos();
        } catch (e) {
            alert("削除に失敗しました");
        }
    }

    // --- 6. 再生速度の変更 ---
    window.changeSpeed = function(s, el) {
        document.getElementById('myVideo').playbackRate = s;
        document.querySelectorAll('.btn-speed').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }

    window.postAdvice = async function() {
        const text = document.getElementById('advise-input').value;
        const user = auth.currentUser;
        const postId = window.currentPostId; // 今見ている動画のID

        if (!user) { alert("ログインが必要です"); return; }
        if (!text) { alert("内容を入力してください"); return; }

        try {
        // postsコレクションの中の、特定の動画ドキュメントの中に「comments」というサブコレクションを作る
            await addDoc(collection(db, "posts", postId, "comments"), {
                text: text,
                userId: user.uid,
                createdAt: new Date()
            });

            document.getElementById('advise-input').value = ""; // 入力欄を空にする
            alert("アドバイスを送信しました！");
            renderComments(postId); // 一覧を更新
        } catch (e) {
            console.error(e);
            alert("送信に失敗しました");
        }
    }

    async function renderComments(postId) {
        const commentList = document.getElementById('comment-list');
        commentList.innerHTML = "読み込み中...";

        // 作成日時順に取得
        const q = query(collection(db, "posts", postId, "comments"), orderBy("createdAt", "asc"));
        const querySnapshot = await getDocs(q);
        
        commentList.innerHTML = "";
        querySnapshot.forEach((doc) => {
            const comment = doc.data();
            const date = comment.createdAt.toDate().toLocaleString(); // 日付を読みやすく変換

            const div = document.createElement('div');
            div.style = "background: white; padding: 10px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #eee; font-size: 0.9em;";
            div.innerHTML = `
                <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                    <span style="color: #999; font-size: 0.8em;">${date}</span>
                </div>
                <div style="line-height: 1.4;">${comment.text}</div>
            `;
            commentList.appendChild(div);
        });
    }

    window.onload = renderVideos;
</script>
