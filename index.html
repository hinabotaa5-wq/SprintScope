<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SprintScope - 陸上アドバイス掲示板</title>
    <style>
        /* ここは「デザイン」を決める場所です（CSS） */
        body { font-family: sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #e67e22; border-bottom: 2px solid #e67e22; }
        .video-placeholder { width: 100%; height: 300px; background: #333; color: white; display: flex; align-items: center; justify-content: center; border-radius: 5px; margin-bottom: 20px; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; padding: 10px; box-sizing: border-box; }
        button { background: #e67e22; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #d35400; }
    </style>
</head>
<body>

    <div class="container">
        <h1>SprintScope</h1>
        <p>走りの動画をチェックしてアドバイスしよう！</p>

        <video controls width="100%" style="border-radius: 5px; margin-bottom: 20px;">
    <source src="IMG_4277.MOV" type="video/quicktime">
    <source src="IMG_4277.MOV" type="video/mp4">
    お使いのブラウザは動画再生に対応していません。
</video>

        <div class="form-area">
            <label>アドバイスを投稿する：</label>
            <textarea placeholder="例：スタートの1歩目をもう少し低く出すと加速がスムーズになりますよ！"></textarea>
            <button>アドバイスを送信</button>
        </div>
    </div>

</body>
</html>
