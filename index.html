<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SprintScope - 陸上アドバイス掲示板</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #e67e22; border-bottom: 2px solid #e67e22; }
        
        /* ボタンの基本デザイン */
        .btn-speed { background: #eee; border: 1px solid #ccc; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin: 0 2px; transition: 0.3s; }
        
        /* ★ 押されたボタン（active）にだけつく色 */
        .btn-speed.active {
            background-color: #e67e22 !important; 
            color: white;
            border-color: #d35400;
            font-weight: bold;
        }

        .form-area { margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; padding: 10px; box-sizing: border-box; }
        .btn-orange { background: #e67e22; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <h1>SprintScope</h1>
    <p>走りの動画をチェックしてアドバイスしよう！</p>

    <video id="myVideo" controls width="100%" style="border-radius: 5px; margin-bottom: 10px;">
        <source src="IMG_4277.MOV" type="video/quicktime">
        <source src="IMG_4277.MOV" type="video/mp4">
        お使いのブラウザは動画再生に対応していません。
    </video>

    <div style="text-align: center; margin-bottom: 20px;">
        <p style="font-size: 0.8em; color: #666; margin-bottom: 5px;">再生速度</p>
        <button class="btn-speed" onclick="changeSpeed(0.5, this)">0.5x (スロー)</button>
        <button class="btn-speed active" onclick="changeSpeed(1.0, this)">1.0x (通常)</button>
        <button class="btn-speed" onclick="changeSpeed(2.0, this)">2.0x (倍速)</button>
    </div>

    <div class="form-area">
        <label style="font-weight: bold; display: block; margin-bottom: 5px;">アドバイスを投稿する：</label>
        <textarea placeholder="例：スタートの1歩目をもう少し低く出すと加速がスムーズになりますよ！"></textarea>
        <button class="btn-orange">アドバイスを送信</button>
    </div>
</div>

<script>
    // element というのは「押されたボタンそのもの」のこと
    function changeSpeed(speed, element) {
        // 1. 動画の速度を変える
        const video = document.getElementById('myVideo');
        video.playbackRate = speed;

        // 2. 一旦、全部のボタンから「active（オレンジ色）」の印を消す
        const buttons = document.querySelectorAll('.btn-speed');
        buttons.forEach(btn => btn.classList.remove('active'));

        // 3. 押されたボタン（element）にだけ「active」の印をつける
        element.classList.add('active');

        console.log("現在の速度: " + speed);
    }
</script>

</body>
</html>
