<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="stylesheet" href="style.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SprintScope - Full Profile Version</title>
</head>

<body>
    <header class="header glass">
        <div class="header-inner">
            <div class="logo-area">
                <h1 class="main-logo" onclick="location.reload()">SprintScope</h1>
                <p class="sub-message">動画を投稿して客観的な視点を取り入れましょう！</p>
            </div>
            
            <div class="header-actions">
                <button id="auth-btn" class="btn-auth-large" onclick="handleAuth()">ログイン</button>
                <button class="profile-icon-large" onclick="switchTab('profile')">👤</button>
            </div>
        </div>
    </header>

    <div id="top-tabs" class="tab-menu">
        <button id="tab-btn-home" class="tab-btn active" onclick="switchTab('home')">ホーム</button>
        <button id="tab-btn-upload" class="tab-btn" onclick="switchTab('upload')">投稿</button>
    </div>

    <div id="home-screen">
        <div class="video-grid" id="main-grid"></div>
    </div>

    <div id="upload-screen" style="display: none;">
        <div class="upload-card">
            
            <h2 class="upload-title">動画を投稿</h2>

            <div class="input-group">
             <label>動画</label>
             <input type="file" id="video-file-input" accept="video/*">
            </div>

            <div class="input-group">
              <label>局面</label>
              <select id="sprint-phase">
                 <option value="スタート">スタート</option>
                 <option value="中間疾走">中間疾走</option>
                 <option value="ラスト">ラスト</option>
              </select>
            </div>

            <div class="input-group">
              <label>聞きたいこと・課題</label>
              <textarea id="user-question"></textarea>
            </div>

            <button class="upload-btn" id="submit-btn" onclick="submitPost()">
            投稿する
            </button>

            <p id="loading-msg" style="display: none; text-align: center; color: #076fa0; font-weight: bold;">
                アップロード中...
            </p>

        </div>
    </div>

    <div id="profile-screen" style="display: none;">
        <button class="btn-back" onclick="switchTab('home')">← 戻る</button>
        <div style="font-weight: bold; margin-top: 20px; margin-bottom: 10px; font-size: 1.5em; padding-left: 2rem;">投稿した動画</div>
        <div id="profile-video-list" class="video-grid" style="margin-bottom: 25px;"></div>
    </div>

    <div id="analysis-screen" style="display: none; max-width: 800px;margin: auto;margin-top: -160px; padding: 0 1rem;">
        <div style="display: flex; align-items: center; gap: 15px; margin-top: 100px; margin-bottom: 10px;">
            <button class="btn-back" onclick="switchTab('home')" style="padding: 5px 12px; font-size: 0.9rem;">← 戻る</button>
            <h2 id="current-title" style="font-size: 1.1rem; margin: 0; color: #1e293b;">動画分析</h2>
        </div>
        
        <div style="background: #000; border-radius: 12px; overflow: hidden; line-height: 0;">
            <video id="myVideo" controls style="width: 100%; max-height: 60vh;" onplay="checkVideoAuth(event)"></video>
        </div>

        <div style="text-align:center; margin: 20px 0;">
            <button class="btn-speed" onclick="changeSpeed(0.25, this)">0.25x</button>
            <button class="btn-speed" onclick="changeSpeed(0.5, this)">0.5x</button>
            <button class="btn-speed active" onclick="changeSpeed(1.0, this)">1.0x</button>
        </div>

        <div class="advice-box">
            <textarea id="advise-input" placeholder="アドバイス・感想を入力" style="width: 100%; max-width: 800px; margin: 0 auto; display: block; height: 60px; font-size: 0.9rem; border-radius: 10px; border: 1px solid #e2e8f0;"></textarea>
            <button class="btn-advise" onclick="postAdvice()" style="margin-top: 8px; width: 100%; padding: 10px; font-weight: 700; border-radius: 8px;">アドバイスを送る</button>
        </div>

        <div id="comment-list" style="margin-top: 15px;"></div>
    </div>

    <script type="module" src="script.js"></script>
</body>
